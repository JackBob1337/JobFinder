services:
  db:
    image: postgres:16
    container_name: job_hunter_db
    restart: always
    environment:
      POSTGRES_USER: job_hunter
      POSTGRES_PASSWORD: job_hunter
      POSTGRES_DB: job_hunter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
